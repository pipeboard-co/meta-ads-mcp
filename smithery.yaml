startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      metaAccessToken:
        type: string
        description: "Meta access token from your own Meta app (recommended). Create an app at https://developers.facebook.com/apps/"
      metaAppId:
        type: string
        description: "Meta App ID (Client ID), for the local OAuth flow when no metaAccessToken is supplied"
    required: []
  commandFunction: |
    (config) => {
      const env = {};
      const args = ["-m", "meta_ads_mcp"];

      // Add Meta access token to environment if provided (recommended auth method)
      if (config.metaAccessToken) {
        env.META_ACCESS_TOKEN = config.metaAccessToken;
      }

      // Add Meta App ID as command-line argument if provided (local OAuth flow)
      if (config.metaAppId) {
        args.push("--app-id", config.metaAppId);
      }

      return {
        command: 'python',
        args: args,
        env: env
      };
    } 
remotes:
  - type: streamable-http
    url: "https://mcp.pipeboard.co/meta-ads-mcp"